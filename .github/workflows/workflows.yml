name: workflows

# actionlint and zizmor over the caller's .github directory, at the versions the caller's
# mise.toml pins and from the artifacts its mise.lock records. The job installs taplo, ShellCheck,
# actionlint and zizmor, the four tools it runs, locked, so it installs the bytes the caller's gate
# installs for them. A run of this job and a run of the gate read the same two files, and both
# prove ShellCheck ran before they trust a clean actionlint run.
#
# The job token sits in this job and in no gate job. Inside a job a step's environment is not a
# boundary, since any step can read the token from the runner, so the token goes to the job that
# installs no dependencies and runs no build or test. Two steps name it: the lockfile asset check
# and zizmor, whose online audits need it.
#
# A caller's uses: job grants permissions: contents: read. A called job can only lower what its
# caller passes, and a caller passing none is refused before any step runs.
on:
  workflow_call:

permissions: {}

# Every mise command in the workflow reads mise.toml and mise.lock alone, the two files the
# caller's gate asserts. mise merges every config file it discovers and each one's sibling
# lockfile, so a committed mise.local.toml with a lockfile of its own would otherwise send the
# install to any url. The names and values are the gate's own: no other config filename, no
# .tool-versions, no environment-specific file, and the url_replacements rule that sends mise's
# url_api fallback to a host that does not resolve. The environment outranks every file mise
# reads, .miserc.toml included. A called workflow inherits no caller's env, so these are set here.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ''
  MISE_AUTO_ENV: 'false'
  MISE_URL_REPLACEMENTS: '{"regex:^https://api\\.github\\.com/repos/[^/]+/[^/]+/releases/assets/.*$":"https://url-api-refused.invalid/"}'

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Before the checkout, so no repository file exists while the action runs. It always runs
      # mise --version and mise ls, and trusts the workspace, so a caller's mise.toml would have
      # its [env] and [vars] exec templates evaluated here, ahead of every refusal below. With
      # install: false and a pinned version it reads no repository file, and the bin directory it
      # puts on PATH lies outside the workspace the checkout cleans. The action verifies its own
      # download against the release's minisign-signed checksums. cache: false, so nothing is
      # restored. github_token: '', because a locked install makes no GitHub API request, and
      # the default exports the job token as MISE_GITHUB_TOKEN to every later step. env: false
      # and export_path: false, because the defaults write the output of mise env --json to
      # GITHUB_ENV and mise's PATH entries to GITHUB_PATH. add_shims_to_path: false, so a bare
      # program name in a later step never resolves to a tool the caller's mise.toml pins. Every
      # step reaches a pinned tool through the path mise which prints.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: false
          cache: false
          github_token: ''
          env: false
          export_path: false
          add_shims_to_path: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job runs beside the caller's gate, not after it, so a red gate stops nothing here.
      # The job therefore refuses what the gate refuses, before any mise command reads the
      # checkout: every mise config, lock or rc file other than mise.toml and mise.lock, in the
      # root and in .config, every file at the root named like a program a gate starts, with any
      # extension, which Windows runs from the current directory ahead of PATH under any
      # extension PATHEXT lists, and every link at the root or
      # under .config, .mise or mise, which mise would follow past the names. Names compare
      # without regard to case, as they do on Windows and macOS. mise.semver.toml and its lock
      # are a Rust repository's named exception, and MISE_ENV above keeps mise from reading
      # them here. The pins above are the second layer.
      - name: Refused files
        run: |
          found=$(
            find . -mindepth 1 -maxdepth 1 \( -iname .tool-versions -o -iname .miserc.toml -o -iname mise -o -iname .mise \
              -o -iname .mise.toml -o -iname .mise.lock -o -iname '.mise.*.toml' -o -iname '.mise.*.lock' \
              -o -iname 'mise.*.toml' -o -iname 'mise.*.lock' \) ! -name mise.semver.toml ! -name mise.semver.lock -print
            find . -mindepth 1 -maxdepth 1 ! -type d \( -iname gh -o -iname 'gh.*' -o -iname bun -o -iname 'bun.*' \
              -o -iname git -o -iname 'git.*' -o -iname mise -o -iname 'mise.*' \) \
              ! -name bun.lock ! -name mise.toml ! -name mise.lock ! -name mise.semver.toml ! -name mise.semver.lock -print
            find . -mindepth 2 -maxdepth 2 -ipath './.config/mise*' -print
            find . -mindepth 1 -maxdepth 1 -type l -print
            find . -mindepth 2 \( -ipath './.config/*' -o -ipath './.mise/*' -o -ipath './mise/*' \) -type l -print
          )
          if [ -n "$found" ]; then
            while IFS= read -r path; do
              echo "::error::mise or a gate reads $(printf '%q' "$path") in place of mise.toml, mise.lock or the program on PATH."
            done <<< "$found"
            echo "::error::Remove each file and link named above."
            exit 1
          fi
      # mise runs a config's hooks, [env] and [vars] exec templates and a tool entry's
      # postinstall command whenever it loads the file, so mise.toml holds [tools], [tool_config]
      # and [settings] alone, each with the keys the caller's gate reads, and mise.lock holds the
      # keys mise writes. The caller's gate compares the values; this step refuses a key before
      # the install below loads the file. A key reaches the log through repr, so a control or
      # bidirectional character prints as an escape.
      - name: Refused keys
        run: |
          python3 - <<'PY'
          import sys, tomllib
          SECTIONS = {
              "tool_config": {"locked"},
              "settings": {"locked", "lockfile", "locked_verify_provenance", "provenance_api_failures_fatal",
                           "lockfile_platforms", "url_replacements"},
          }
          OPTIONS = {"version", "version_prefix"}
          found = []
          with open("mise.toml", "rb") as file:
              pins = tomllib.load(file)
          for key, value in pins.items():
              if key == "tools" and isinstance(value, dict):
                  for tool, entry in value.items():
                      if isinstance(entry, dict):
                          found += [f"mise.toml gives {tool!r} the option {option!r}" for option in entry if option not in OPTIONS]
              elif key in SECTIONS and isinstance(value, dict):
                  found += [f"mise.toml sets {name!r} under [{key}]" for name in value if name not in SECTIONS[key]]
              elif key not in ("tools", *SECTIONS):
                  found.append(f"mise.toml carries {key!r}")
          with open("mise.lock", "rb") as file:
              lock = tomllib.load(file)
          found += [f"mise.lock carries {key!r}" for key in lock if key not in ("lockfile_version", "tools")]
          for tool, entries in (lock.get("tools") or {}).items():
              for entry in entries if isinstance(entries, list) else []:
                  for key, value in (entry.items() if isinstance(entry, dict) else ()):
                      if key.startswith("platforms."):
                          fields = value if isinstance(value, dict) else {}
                          found += [f"mise.lock gives {tool!r} on {key!r} the key {field!r}" for field in fields
                                    if field not in ("checksum", "url", "url_api", "provenance")]
                      elif key == "options":
                          options = value if isinstance(value, dict) else {"(not a table)": None}
                          found += [f"mise.lock gives {tool!r} the option {option!r}" for option in options if option not in OPTIONS]
                      elif key not in ("version", "backend", "specifiers", "platforms"):
                          found.append(f"mise.lock gives {tool!r} the key {key!r}")
          for finding in found:
              print(f"::error::{finding}, which no rule reads. Remove it.")
          sys.exit(1 if found else 0)
          PY
      # With the refusals passed, the four tools this job runs install, locked, so a tool the
      # lockfile does not pin for this platform is refused. mise re-verifies each artifact and its
      # provenance line, since nothing was restored. Each is a registry tool whose attestation
      # mise reads from mise-versions.jdx.dev, so the step needs no token. A caller's other pins,
      # such as a github: coordinate whose attestation only GitHub's API serves, are left alone.
      # If mise-versions cannot verify an attestation, mise asks GitHub's API instead, without a
      # token, and a refused or rate-limited answer fails the install.
      - name: mise install
        run: mise install --locked taplo shellcheck actionlint zizmor
      # mise.lock names each artifact twice: the url mise downloads, and url_api, the same asset
      # by id. GitHub records each asset's download address, and its sha256 for an asset uploaded
      # since it began keeping digests. This step asks GitHub for every asset the lockfile names
      # by id and requires the address to equal the lockfile's url and the digest, where GitHub
      # keeps one, to equal its checksum. For a tool whose release carries no attestation,
      # ShellCheck today, that digest is the second source for the checksum mise verifies. An
      # asset with no digest, taplo's, is held to its address alone. Both spellings of a
      # platform table are read, and a url_api outside the asset reference form, a failed call
      # or a lockfile naming no asset at all fails the step. A lockfile value reaches the log
      # through printf %q, so a control character in it prints as an escape.
      - name: Lockfile assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          taplo=$(mise which taplo)
          "$taplo" get -f mise.lock -o json > "$RUNNER_TEMP/lock.json"
          jq -r '
            .tools // {} | to_entries[] | .key as $tool | .value[] |
            ( (to_entries[] | select(.key | startswith("platforms.")) | {platform: (.key | ltrimstr("platforms.")), entry: .value}),
              (.platforms // {} | to_entries[] | {platform: .key, entry: .value}) ) |
            select(.entry.url_api != null) |
            [$tool, .platform, .entry.url_api, (.entry.url // ""), (.entry.checksum // "")] | @tsv
          ' "$RUNNER_TEMP/lock.json" > "$RUNNER_TEMP/assets.tsv"
          reference='^https://api\.github\.com/(repos/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+/releases/assets/[0-9]+)$'
          checked=0
          failed=0
          while IFS=$'\t' read -r tool platform api url checksum; do
            label="$(printf '%q %q' "$tool" "$platform")"
            if [[ ! "$api" =~ $reference ]] || [[ "$api" == */../* ]] || [[ "$api" == */./* ]]; then
              echo "::error::$label url_api is not a release asset reference: $(printf '%q' "$api")"
              failed=1
              continue
            fi
            path=${BASH_REMATCH[1]}
            if ! asset=$(gh api "$path" --jq '[.browser_download_url, (.digest // "")] | @tsv' < /dev/null); then
              echo "::error::$label: gh api $path failed"
              failed=1
              continue
            fi
            IFS=$'\t' read -r served digest <<< "$asset"
            if [ "$served" != "$url" ]; then
              echo "::error::$label: GitHub serves asset $path at $served, and mise.lock records $(printf '%q' "$url")"
              failed=1
            fi
            if [ -n "$digest" ] && [ "$digest" != "$checksum" ]; then
              echo "::error::$label: GitHub records $digest for asset $path, and mise.lock records $(printf '%q' "$checksum")"
              failed=1
            fi
            checked=$((checked + 1))
          done < "$RUNNER_TEMP/assets.tsv"
          if [ "$checked" -eq 0 ] && [ "$failed" -eq 0 ]; then
            echo "::error::mise.lock names no release asset by id, so this step checked nothing."
            exit 1
          fi
          echo "Checked $checked lockfile assets against GitHub."
          exit "$failed"
      # actionlint exits 0 with ShellCheck absent or unable to start, and no flag changes that. A
      # path that resolves to nothing turns the rule off with no word outside -verbose. This step
      # writes a workflow whose one finding belongs to ShellCheck and requires the finding back, so
      # the clean run below carries weight. The path is resolved in its own statement, so a failed
      # resolution stops the step, and the run below reads the path this step proved.
      # -pyflakes= turns the Python linter off. No caller pins one, so a finding from it would be
      # one the caller's gate never reports.
      - name: ShellCheck present
        id: shellcheck
        run: |
          shellcheck=$(mise which shellcheck)
          actionlint=$(mise which actionlint)
          canary=$(mktemp -d)
          cat > "$canary/canary.yml" <<'CANARY'
          name: canary
          on: push
          jobs:
            canary:
              runs-on: ubuntu-latest
              steps:
                - run: echo $GITHUB_REF
          CANARY
          found=$("$actionlint" -pyflakes= -shellcheck="$shellcheck" "$canary/canary.yml" || true)
          case "$found" in
            *SC2086*) ;;
            *)
              echo "::error::actionlint found no SC2086 in a script that carries one, so ShellCheck never ran."
              echo "::error::Check that ${shellcheck} starts."
              exit 1
              ;;
          esac
          echo "path=$shellcheck" >> "$GITHUB_OUTPUT"
          echo "actionlint=$actionlint" >> "$GITHUB_OUTPUT"
      # -shellcheck names the binary the step above proved, so actionlint cannot pick another off
      # PATH, and the actionlint that runs is the one the step above ran.
      - name: actionlint
        env:
          ACTIONLINT: ${{ steps.shellcheck.outputs.actionlint }}
          SHELLCHECK: ${{ steps.shellcheck.outputs.path }}
        run: '"$ACTIONLINT" -pyflakes= -shellcheck="$SHELLCHECK"'
      # Online, so the audits that ask GitHub run: a pinned commit outside its action's
      # repository, a known-vulnerable action, a version comment naming the wrong tag. The job
      # token is enough for them and is read-only, and any failed call aborts the run. Every
      # gate runs zizmor offline in CI, so this step is where those audits run.
      # --strict-collection fails on a file zizmor cannot parse. Without it a broken workflow is
      # dropped and reported as clean. The config is named, so ZIZMOR_CONFIG in the environment
      # cannot swap it. The input is .github, the gate's own input, which holds the workflows,
      # dependabot.yml and any composite action under .github/actions. --collect=all turns
      # zizmor's ignore handling off, so no .gitignore, exclude file or global excludes file can
      # hide one of them.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor=$(mise which zizmor)
          "$zizmor" --no-progress --strict-collection --config .github/zizmor.yml --collect=all .github
