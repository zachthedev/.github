name: cd

# Everything after a merge. A push to main keeps the release pull request open, and merging
# that pull request makes the next push tag the merge commit and draft the release. This
# repository ships no artifact, so publish attaches nothing and flips the draft public under the
# release environment's reviewer. The tag exists from the draft, so a caller's Renovate sees a
# new version of the reusable workflows before the flip.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-pr:
    uses: ./.github/workflows/release-pr.yml
    # The called job names the release-pr environment, so its variable and secret resolve
    # from this repository's environment of that name. This job runs in no environment, so
    # it cannot pass an environment secret by name. inherit is the one form that reaches it.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # After a release was drafted. The calling job grants what the called job declares, the
  # attestation scopes included, because the declaration is static and the attest step is
  # skipped with no artifacts. No secret: the job uses the job token alone.
  publish:
    needs: release-pr
    if: needs.release-pr.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-pr.outputs.tag }}
      flip: true
