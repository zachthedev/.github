name: audit

# The whole-tree reports, each on its own clock. A red run is a report, never a check: it means
# work to pick up. Nothing merges, releases or deploys through this file. The pull request checks
# in ci.yml hold what a change adds. This file reports what the world found about the tree since.
#
# Daily, bun audit reads every package in bun.lock, transitives included, against the live
# database and exits non-zero at or above its audit level. The work is a direct bump through
# Renovate's next security fix or a transitive one by hand with bun audit fix.
#
# Weekly, the workflows job runs zizmor's online audits over the pinned actions: a pinned commit
# outside its action's repository, a stale action ref, a known-vulnerable action. Those answers
# change with no pull request, so a schedule is what asks again.
#
# Each cron string is written twice: once below, and once in the if: of the job it starts. GitHub
# offers a job no schedule of its own, and a YAML alias cannot sit inside an expression, so no
# form writes it once. Neither actionlint nor zizmor compares the two copies. A one-sided edit
# leaves a job that never runs on its schedule and reports nothing, so an edit to either string
# changes both.
on:
  schedule:
    # At least once a day. The hour is clear of deps.yml's cron. The audit job's if: repeats it.
    - cron: '41 5 * * *'
    # At least once a week. Monday, an hour after the daily run. The workflows job's if: repeats
    # it.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # The daily clock, and every dispatch. The schedule context carries the cron that fired, and
  # the string here is the daily cron's copy.
  audit:
    if: github.event_name != 'schedule' || github.event.schedule == '41 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun audit reads bun.lock, so the job needs Bun and no install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The verdict is a claim about an external database, and a clean verdict names no
      # endpoint. bun audit has no --registry flag, and this variable outranks bunfig.toml and
      # a dotenv, so setting it here fixes the endpoint for the run.
      - run: bun audit
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

  # The weekly clock, and every dispatch. The string here is the weekly cron's copy. The calling
  # job grants what the called job declares.
  workflows:
    if: github.event_name != 'schedule' || github.event.schedule == '41 6 * * 1'
    permissions:
      contents: read
    uses: ./.github/workflows/workflows.yml
