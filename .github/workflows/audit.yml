name: audit

# The whole-tree advisory report, on its own clock. bun audit reads every package in bun.lock,
# transitives included, against the live database and exits non-zero at or above its audit
# level. A red run is a report, never a check: it means work to pick up, a direct bump through
# Renovate's next security fix or a transitive one by hand with bun audit fix. Nothing merges,
# releases or deploys through this file. The pull request checks in ci.yml hold what a change
# adds. This file reports what the world found about the tree since.
on:
  # At least once a day. The hour is clear of deps.yml's cron.
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun audit reads bun.lock, so the job needs Bun and no install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The verdict is a claim about an external database, and a clean verdict names no
      # endpoint. bun audit has no --registry flag, and this variable outranks bunfig.toml and
      # a dotenv, so setting it here fixes the endpoint for the run.
      - run: bun audit
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/
