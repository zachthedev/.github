name: ci

# Everything that judges a pull request: the gate on three platforms, the commit messages, the
# workflow linters and the advisory check. The three shared jobs call the reusable workflows
# beside this file by relative path, which needs no pin.
on:
  # Every pull request, whatever it targets. A stacked pull request is based on the layer
  # below it, and a base filter would leave each middle layer with no checks.
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every mise command in the workflow reads mise.toml and mise.lock alone, under the pins every
# gate mise command carries: no other config filename, no .tool-versions, no environment-specific
# file, and the url_replacements rule that sends mise's url_api fallback to a host that does not
# resolve. The gate builds its own mise environment from these values too.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ''
  MISE_AUTO_ENV: 'false'
  MISE_URL_REPLACEMENTS: '{"regex:^https://api\\.github\\.com/repos/[^/]+/[^/]+/releases/assets/.*$":"https://url-api-refused.invalid/"}'

jobs:
  # The gate a contributor runs locally, called and never restated. bun run check:rows prints
  # what it covers. It resolves every tool through mise which, asserts mise.lock against
  # mise.toml, then installs, in that order by construction. No step here names a token, so the
  # gate's zizmor runs offline, and zizmor's online audits run in the workflows job below.
  gate:
    strategy:
      # One platform failing still reports the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # mise alone, and before the checkout, so no repository file exists while the action runs.
      # It always runs mise --version and mise ls, and trusts the workspace, so a mise.toml would
      # have its [env] and [vars] exec templates evaluated here, ahead of the gate's refusals.
      # With install: false and a pinned version it reads no repository file, and the bin
      # directory it puts on PATH lies outside the workspace the checkout cleans. The action
      # verifies its download against the release's signed checksums. install: false, also
      # because the gate asserts mise.lock before it installs from it. cache: false, so nothing
      # is restored ahead of the assertions. github_token: '', because a locked install makes no
      # GitHub API request, and the default exports the job token as MISE_GITHUB_TOKEN to every
      # later step. env: false and export_path: false, because the defaults write the output of
      # mise env --json to GITHUB_ENV and mise's PATH entries to GITHUB_PATH. add_shims_to_path:
      # false, so a tool mise.toml pins never shadows a program the gate starts by name.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: false
          cache: false
          github_token: ''
          env: false
          export_path: false
          add_shims_to_path: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # packageManager in package.json is the one Bun pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # --ignore-scripts, so no package's lifecycle script and no prepare script runs in CI.
      # The gate starts every package from its path under node_modules and needs none of them.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Bun runs the file directly rather than through the package script, whose runner puts
      # node_modules/.bin first on PATH, ahead of the programs the gate starts.
      - run: bun scripts/check.ts

  # Each calling job grants what its called job declares. A called job can only lower what its
  # caller passes, and a caller passing none is refused before any step runs.
  commits:
    permissions:
      contents: read
    uses: ./.github/workflows/commits.yml

  workflows:
    permissions:
      contents: read
    uses: ./.github/workflows/workflows.yml

  dependency-review:
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-review.yml
