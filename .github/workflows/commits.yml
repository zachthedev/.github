name: commits

# Commit messages on a pull request, linted by the commitlint the caller pins. The caller's
# package.json and bun.lock carry commitlint, and its commitlint.config.js carries the rules and
# reads .github/commit-scopes.json. The job therefore lints what the caller's commit-msg hook
# lints, from the same lockfile. The range is the pull request's base..head, and commitlint reads
# it from git. The subject a squash writes is linted too: the only commit's subject for a
# one-commit pull request, the title otherwise, with the pull request number appended.
#
# The tree refusals run on every event the caller calls the job for: a pull request, a push to
# the default branch, and the caller's daily audit run. So a tree two pull requests produce
# together, which neither pull request's run read, meets them at the push, and a push that
# started no run, one whose message holds [skip ci] or one made with the workflow token, meets
# them at the caller's next daily audit run. setup-bun, the install and both commitlint steps
# run on a pull request alone, since only a pull request carries a range and a title.
#
# A caller's uses: job grants permissions: contents: read. A called job can only lower what its
# caller passes, and a caller passing none is refused before any step runs.
on:
  workflow_call:

permissions: {}

jobs:
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so a pull request's base..head is present. A shallow clone leaves
      # commitlint nothing to read. The job pushes nothing, so the token does not stay in the
      # checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # setup-bun installs the Bun that package.json's packageManager names, reading whatever
      # follows bun@ there. A range such as ^1.4.0 or 1, or a name such as latest or canary,
      # resolves against Bun's tags when the job runs, past any cooldown, and a packageManager that
      # is missing, names no Bun or sits in a package.json that does not parse installs the newest
      # release. So packageManager reads bun@X.Y.Z exactly, in package.json read the way the action
      # reads it. A root .node-version, which a caller's actions/setup-node step reads, holds one
      # X.Y.Z line and at most one newline: setup-node keeps the image's node on an empty one,
      # resolves a range or a name such as lts/* when the job runs, and follows a JSON one to
      # another file. The step runs before setup-bun, on every event.
      - name: Held runtime pins
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          EXACT = r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
          found = []
          try:
              with open("package.json", encoding="utf-8") as file:
                  manifest = json.load(file)
          except (OSError, UnicodeDecodeError, ValueError) as error:
              found.append(f"package.json does not read as JSON ({error})")
          else:
              pin = manifest.get("packageManager") if isinstance(manifest, dict) else None
              if not isinstance(pin, str) or not re.fullmatch("bun@" + EXACT, pin):
                  found.append(f"package.json gives packageManager as {pin!r}, not bun@X.Y.Z")
          if os.path.lexists(".node-version"):
              try:
                  with open(".node-version", "rb") as file:
                      held = file.read(256)
              except OSError as error:
                  found.append(f".node-version does not read as a file ({error})")
              else:
                  if not re.fullmatch(EXACT.encode() + rb"\n?", held):
                      found.append(f".node-version holds {held!r}, not one X.Y.Z line")
          for finding in found:
              print(f"::error::{finding}. A range, a name or an empty pin installs a release no cooldown held. Pin the exact version.")
          sys.exit(1 if found else 0)
          PY
      # This job runs beside the caller's gate, whatever its stack, so before the install it refuses
      # what would hand commitlint a copy the lockfile does not name. bun install keeps a tracked
      # package directory at the locked version in place of the one it would fetch, and commitlint
      # then runs that copy. It keeps a tracked node_modules link the same way, with no check
      # against bun.lock, so node_modules itself is refused beside any path below it. Every other
      # tracked symbolic link is refused too: Bun reads through one to a file bun.lock never
      # named. bun install loads an env file at the root, frozen and without scripts, and no flag
      # stops that. A variable there can move its registry, skip the lockfile or point its cache
      # at a committed folder, which swaps a package with no bun.lock change. Bun loads an env file
      # from the directory each start runs in, and a caller starts Bun below the root too, so each
      # of the eight names Bun loads is refused at any depth. Both commitlint steps name
      # commitlint.config.js, which stops commitlint reading any other config. cosmiconfig, which
      # commitlint searches through, still reads its own settings from a root .config directory
      # and a root package.yaml when it starts, whatever --config names. It runs a
      # .config/config.js, .mjs, .cjs or .ts as code, and a module a $import there names. So a
      # tracked root .config and a root package.yaml are refused. git lists paths with
      # core.quotepath off, so a name past ASCII reaches each pattern as its own characters rather
      # than octal escapes. Paths match without regard to case, as Windows and macOS open them. A
      # failed git call stops the step.
      - name: Refused paths
        run: |
          tracked=$(git -c core.quotepath=off ls-files)
          found=$(printf '%s\n' "$tracked" | grep -iE '(^"?|/)node_modules("?$|/)' || true)
          links=$(git ls-files -s | awk -F '\t' '$1 ~ /^120000 / { print $2 }')
          meta=$(printf '%s\n' "$tracked" | grep -iE '^"?\.config(/|"?$)' || true)
          yaml=$(printf '%s\n' "$tracked" | grep -iE '^"?package\.yaml"?$' || true)
          envs=$(printf '%s\n' "$tracked" | grep -iE '(^"?|/)\.env(\.local|\.(development|production|test)(\.local)?)?"?$' || true)
          if [ -n "$found" ] || [ -n "$links" ] || [ -n "$meta" ] || [ -n "$yaml" ] || [ -n "$envs" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is tracked, and bun install would read it in place of what bun.lock names."
            done <<< "$found"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is a tracked symbolic link. bun install keeps a link as it finds it, and what Bun reads through one is no file bun.lock names."
            done <<< "$links"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is under the root .config, where cosmiconfig reads a config before commitlint loads the one named."
            done <<< "$meta"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is a root package.yaml, where cosmiconfig reads its own settings before commitlint loads the config named."
            done <<< "$yaml"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is an env file Bun loads, which can swap a package with no bun.lock change."
            done <<< "$envs"
            echo "::error::Remove each path named above."
            exit 1
          fi
      # Bun reads bunfig.toml at the root each time it starts, and bun install reads its [install]
      # table. A preload there runs code inside commitlint before its first line, and no step here
      # names another config. So a tracked one, matched without regard to case, carries one key
      # at most: [install] minimumReleaseAge, whatever its value, as the caller's gate allows.
      # python3's tomllib reads it, and a file it cannot parse, or one that is not a plain file,
      # is refused.
      - name: Refused bunfig
        run: |
          python3 - <<'PY'
          import subprocess, sys, tomllib
          listed = subprocess.run(["git", "ls-files", "-s", "-z"], capture_output=True, check=True).stdout.decode()
          found = []
          for entry in filter(None, listed.split("\0")):
              info, name = entry.split("\t", 1)
              if name.lower() != "bunfig.toml":
                  continue
              if not info.startswith("100"):
                  found.append(f"{name!r} is not a plain file")
                  continue
              try:
                  with open(name, "rb") as file:
                      held = tomllib.load(file)
              except (OSError, tomllib.TOMLDecodeError) as error:
                  found.append(f"{name!r} does not parse as TOML: {error}")
                  continue
              install = held.get("install", {})
              extra = [key for key in held if key != "install"]
              if isinstance(install, dict):
                  extra += [f"install.{key}" for key in install if key != "minimumReleaseAge"]
              else:
                  found.append(f"{name!r} carries install as something other than a table")
              if extra:
                  found.append(f"{name!r} carries {', '.join(map(repr, extra))}")
          for finding in found:
              print(f"::error::{finding}. Bun reads bunfig.toml before commitlint runs, and the one key allowed is [install] minimumReleaseAge.")
          sys.exit(1 if found else 0)
          PY
      # Bun reads package.json and a project config keeping the first of two equal keys, where jq
      # and JSON.parse keep the last, and jq stops at a nesting depth Bun passes. So python3's json
      # module reads every tracked package.json, tsconfig.json and jsconfig.json, at any depth and
      # in any case, and every file an extends names. It refuses a key repeated in one object and
      # anything that is not plain JSON: a trailing comma, a comment, a byte order mark, NaN, a
      # depth it cannot read. A package.json patchedDependencies key is applied even by a frozen
      # install without scripts, so the key is refused in every tracked package.json, whatever it
      # patches. Bun resolves a bare import of a package's own name, from a file inside it, to that
      # package.json's exports ahead of node_modules, so a root package.json named yaml or
      # @commitlint/config-conventional with exports runs checkout code inside both commitlint
      # steps, with bun.lock untouched. So an exports key is refused in every tracked package.json.
      # imports stays, since its # names cannot shadow a bare one. cosmiconfig reads a cosmiconfig
      # key in the root package.json whatever --config names, and runs a module a $import there
      # names, so the key is refused. Bun applies a project config to commitlint's own imports, so
      # a paths entry or a baseUrl there, or in a file its extends names, runs checkout code in
      # place of a package commitlint loads. An extends naming a package, an absolute path, a
      # missing file or a file outside the checkout is refused, since the step cannot read it
      # before the install. This is a step of its own because actionlint stalls on Windows handing
      # ShellCheck a script past 4 KB.
      - name: Refused JSON keys
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          listed = subprocess.run(["git", "-c", "core.quotepath=off", "ls-files", "-z"], capture_output=True, check=True)
          root = os.path.realpath(".")
          found = []
          MISSING = object()
          def unique(pairs):
              seen, repeated = set(), set()
              for key, _ in pairs:
                  (repeated if key in seen else seen).add(key)
              if repeated:
                  raise ValueError(f"repeats {', '.join(map(repr, sorted(repeated)))} in one object")
              return dict(pairs)
          def refuse(constant):
              raise ValueError(f"holds {constant}")
          def read(name):
              try:
                  with open(name, encoding="utf-8") as file:
                      return json.load(file, object_pairs_hook=unique, parse_constant=refuse)
              except (OSError, UnicodeDecodeError, ValueError, RecursionError) as error:
                  found.append(f"{name!r} is not plain JSON with each key once per object ({error}). Rewrite it that way")
                  return MISSING
          queue = []
          for name in map(os.fsdecode, filter(None, listed.stdout.split(b"\0"))):
              base = name.rsplit("/", 1)[-1].lower()
              if base in ("tsconfig.json", "jsconfig.json"):
                  queue.append(name)
              if base != "package.json" or (held := read(name)) is MISSING:
                  continue
              if not isinstance(held, dict):
                  found.append(f"{name!r} is not a JSON object. Make it one")
                  continue
              if "patchedDependencies" in held:
                  found.append(f"{name!r} carries patchedDependencies, and bun install applies each patch it names even frozen and without scripts. Remove the key")
              if "exports" in held:
                  found.append(f"{name!r} carries exports, which a bare import of the package's own name resolves to ahead of node_modules. Remove the key")
              if name.lower() == "package.json" and "cosmiconfig" in held:
                  found.append(f"{name!r} carries a cosmiconfig key, whose $import runs a module inside commitlint whatever --config names. Remove the key")
          seen = set()
          while queue:
              name = queue.pop()
              if name in seen:
                  continue
              seen.add(name)
              if (held := read(name)) is MISSING:
                  continue
              options = held.get("compilerOptions", {}) if isinstance(held, dict) else None
              if not isinstance(options, dict):
                  found.append(f"{name!r} is not an object with an object compilerOptions. Make it one")
                  continue
              aliased = [key for key in ("paths", "baseUrl") if key in options]
              if aliased:
                  found.append(f"{name!r} sets {' and '.join(aliased)}, which Bun applies to commitlint's own imports. Remove it, and alias through package.json imports instead")
              targets = held.get("extends", [])
              for target in targets if isinstance(targets, list) else [targets]:
                  resolved = ""
                  if isinstance(target, str) and target.startswith(("./", "../")) and "\0" not in target:
                      resolved = os.path.realpath(os.path.join(os.path.dirname(name), target))
                      if not os.path.isfile(resolved) and os.path.isfile(resolved + ".json"):
                          resolved += ".json"
                  if not os.path.isfile(resolved) or os.path.commonpath([root, resolved]) != root:
                      found.append(f"{name!r} extends {target!r}, which is no file in the checkout this step can read before the install. Extend one by a ./ or ../ path")
                  else:
                      queue.append(os.path.relpath(resolved, root).replace(os.sep, "/"))
          for finding in found:
              print(f"::error::{finding}.")
          sys.exit(1 if found else 0)
          PY
      # The shared deps job names .github/renovate.json in RENOVATE_CONFIG_FILE_NAMES, and Renovate
      # puts the names it lists ahead of its own, so that file wins wherever it exists. Without
      # it, Renovate falls back to its own list and reads a root renovate.json, a .renovaterc or a
      # package.json renovate key in its place. So a tree that does not track
      # .github/renovate.json as a plain file, in that exact spelling, is refused. A failed git
      # call lists nothing, which the step refuses too.
      - name: Held Renovate config
        run: |
          held=$(git ls-files -s -- .github/renovate.json | awk -F '\t' '$1 ~ /^100(644|755) / { print $2 }')
          if [ "$held" != .github/renovate.json ]; then
            echo "::error::The tree tracks no .github/renovate.json file. The deps job names it ahead of Renovate's own list, and without it Renovate reads a root renovate.json, a .renovaterc or a package.json renovate key in its place. Restore the file."
            exit 1
          fi
      # packageManager in the caller's package.json is the one Bun pin. The action verifies no
      # download, so that pin plus the cooldown is the control. It runs after every tree
      # refusal, on a pull request alone, as the install and both commitlint steps do.
      - if: github.event_name == 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # --ignore-scripts, so no lifecycle script and no prepare script from the caller's tree
      # runs here. commitlint needs none of them.
      - if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile --ignore-scripts
      # --from and --to are commitlint's own range: it walks base..head in git. commitlint starts
      # by its path under node_modules, which the install above wrote from bun.lock, so a missing
      # copy fails the step. bunx --no-install would fall back to PATH, a parent node_modules/.bin
      # or its cache. Bun runs the file itself, so no shebang picks a node. --no-env-file keeps Bun
      # from loading a .env from the checkout into commitlint's environment. --no-install makes a
      # bare import that no node_modules answers an error, where Bun would fetch a copy from its
      # install cache or the registry, whatever bun.lock pins. --config names the caller's one
      # config, so no name commitlint searches before it can stand in for it. No --verbose: the
      # runner keeps the first 64 KiB of Bun's output and drops the rest, and a verbose log of a
      # long range runs past that, so the step prints each problem and the summary alone. The exit
      # code covers every commit either way. COMMITLINT_DEPENDABOT_PULL_REQUEST is true on a pull
      # request Dependabot opened alone, and the set's commitlint.config.js skips a
      # Dependabot-shaped commit only then, since anyone can type Dependabot's header and trailer.
      - name: Pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMITLINT_DEPENDABOT_PULL_REQUEST: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: bun --no-env-file --no-install ./node_modules/@commitlint/cli/cli.js --config commitlint.config.js --from "$BASE_SHA" --to "$HEAD_SHA"
      # GitHub's default squash message lands a one-commit pull request under that commit's subject
      # and a longer one under the title, each with the pull request number appended. That string
      # reaches the default branch, so it is the one the header length rule reads. Every value
      # arrives through the environment and reaches commitlint on stdin, so none is ever a shell
      # word. The caller's rules apply with every ignore off: its config's own ignores and
      # commitlint's defaults (merge, revert, fixup and version subjects) each match text a
      # contributor can type into a title or subject. The config that turns them off is written
      # to the runner's temporary directory, outside the checkout, so no tracked path takes part.
      # commitlint resolves a config's extends from that config's own directory, where no
      # node_modules sits. So the written config resolves each extends of the caller's config from
      # the caller's config file and hands commitlint absolute paths. --no-install, as in the step
      # above, turns any other bare import there into an error rather than a fetch.
      - name: Squash subject
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$COMMITS" = "1" ]; then
            subject=$(git log -1 --format=%s "$HEAD_SHA")
          else
            subject=$TITLE
          fi
          config=$RUNNER_TEMP/commitlint-landing.mjs
          rm -f -- "$config"
          cat > "$config" <<'JS'
          import { createRequire } from 'node:module';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const caller = join(process.cwd(), 'commitlint.config.js');
          const { default: config } = await import(pathToFileURL(caller).href);
          const require = createRequire(caller);
          export default {
            ...config,
            extends: [config.extends ?? []].flat().map((id) => require.resolve(id)),
            ignores: [],
            defaultIgnores: false,
          };
          JS
          printf '%s (#%s)\n' "$subject" "$NUMBER" | bun --no-env-file --no-install ./node_modules/@commitlint/cli/cli.js --config "$config" --verbose
