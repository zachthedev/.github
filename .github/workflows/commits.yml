name: commits

# Commit messages on a pull request, linted by the commitlint the caller pins. The caller's
# package.json and bun.lock carry commitlint, and its commitlint.config.js carries the rules and
# reads .github/commit-scopes.json. The job therefore lints what the caller's commit-msg hook
# lints, from the same lockfile. The range is the pull request's base..head, and commitlint reads
# it from git. The subject a squash writes is linted too: the only commit's subject for a
# one-commit pull request, the title otherwise, with the pull request number appended.
#
# A caller's uses: job grants permissions: contents: read. A called job can only lower what its
# caller passes, and a caller passing none is refused before any step runs.
on:
  workflow_call:

permissions: {}

jobs:
  commits:
    # A push carries no pull request range or title, so the job runs on a pull request alone.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so base..head is present. A shallow clone leaves commitlint nothing to
      # read. The job pushes nothing, so the token does not stay in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # packageManager in the caller's package.json is the one Bun pin. The action verifies no
      # download, so that pin plus the cooldown is the control.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # This job runs beside the caller's gate, whatever its stack, so before the install it refuses
      # what would hand commitlint a copy the lockfile does not name. bun install keeps a tracked
      # package directory at the locked version in place of the one it would fetch, and bunx then
      # runs that copy. A tracked .npmrc, at any depth, redirects the install's registry. A
      # package.json patchedDependencies entry is applied even by a frozen install without scripts,
      # so one naming an @commitlint package or a package commitlint.config.js imports is refused.
      # commitlint takes the first config it finds, and a package.json commitlint key, a
      # package.yaml and a .commitlintrc file each come before commitlint.config.js in its search.
      # So every commitlint config but the root commitlint.config.js is refused at any depth, a
      # package.yaml whole, since the step reads no YAML, and every tracked package.json is read for
      # the key. cosmiconfig, which commitlint searches through, reads a meta config from a root
      # .config directory and a package.json cosmiconfig key when it starts, whatever --config
      # names, and runs a .config/config.js, .mjs, .cjs or .ts as code. So a tracked root .config
      # and a cosmiconfig key are refused too. Paths match without regard to case, as Windows and
      # macOS open them. A failed git or jq call, a malformed package.json among them, stops the step.
      - name: Refused paths
        run: |
          tracked=$(git ls-files)
          found=$(printf '%s\n' "$tracked" | grep -iE '(^"?|/)node_modules/|(^"?|/)\.npmrc"?$' || true)
          configs=$(printf '%s\n' "$tracked" | grep -iE '(^"?|/)(\.commitlintrc[^/]*|commitlint\.config\.[^/]*|package\.yaml"?)$' | grep -vxF commitlint.config.js || true)
          meta=$(printf '%s\n' "$tracked" | grep -iE '^"?\.config(/|"?$)' || true)
          keyed=""
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            carries=$(jq -r 'if type == "object" then [keys[] | select(. == "commitlint" or . == "cosmiconfig")] | join(" and ") else error("is not an object") end' "$manifest")
            if [ -n "$carries" ]; then
              keyed+="$(printf '%q' "$manifest") carries a $carries key"$'\n'
            fi
          done <<< "$(printf '%s\n' "$tracked" | grep -iE '(^"?|/)package\.json"?$' || true)"
          patched=$(jq -r '(.patchedDependencies // {}) | if type == "object" then keys[] else error("patchedDependencies is not an object") end' package.json)
          imported=""
          if [ -f commitlint.config.js ]; then
            imported=$(grep -oE "(from|import\(|require\()[[:space:]]*['\"][^'\"]+['\"]" commitlint.config.js | sed -E "s/^[^'\"]*['\"]//; s/['\"]$//" || true)
          fi
          refused=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            name=$(printf '%s' "$entry" | sed -E 's/^(@?[^@]+)@.*$/\1/')
            case "$name" in
              @commitlint/*) refused+="$entry"$'\n' ;;
              *)
                while IFS= read -r specifier; do
                  case "$specifier" in
                    "$name" | "$name"/*) refused+="$entry"$'\n' ;;
                  esac
                done <<< "$imported"
                ;;
            esac
          done <<< "$patched"
          if [ -n "$found" ] || [ -n "$configs" ] || [ -n "$meta" ] || [ -n "$keyed" ] || [ -n "$refused" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is tracked, and bun install would read it in place of what bun.lock names."
            done <<< "$found"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") can hold a commitlint config, and commitlint.config.js at the root is the one commitlint config."
            done <<< "$configs"
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is under the root .config, where cosmiconfig reads a config before commitlint loads the one named."
            done <<< "$meta"
            while IFS= read -r finding; do
              [ -n "$finding" ] && echo "::error::$finding, and commitlint.config.js at the root is the one commitlint config."
            done <<< "$keyed"
            while IFS= read -r entry; do
              [ -n "$entry" ] && echo "::error::package.json patches $(printf '%q' "$entry"), a package commitlint loads."
            done <<< "$refused"
            echo "::error::Remove each path, key and patch named above."
            exit 1
          fi
      # Under --bun, Bun applies a tsconfig.json or jsconfig.json to commitlint's own imports, so a
      # paths entry or a baseUrl there runs checkout code in place of a package commitlint loads.
      # Every tracked one, at any depth and in any case, and every file its extends names, is read
      # for either. An extends naming a package or a file outside the checkout is refused, since
      # the step cannot read it before the install. A failed git or jq call stops the step: a
      # malformed file among them, and one carrying comments, which jq does not read. This is a
      # step of its own because actionlint stalls on Windows handing ShellCheck a script past 4 KB.
      - name: Refused TypeScript path aliases
        run: |
          tracked=$(git ls-files)
          aliased=""
          root=$(realpath -m -- "$PWD")
          mapfile -t queue < <(printf '%s\n' "$tracked" | grep -iE '(^"?|/)(tsconfig|jsconfig)\.json"?$' || true)
          declare -A visited=()
          index=0
          while [ "$index" -lt "${#queue[@]}" ]; do
            file=${queue[$index]}
            index=$((index + 1))
            [ -n "$file" ] || continue
            [ -z "${visited[$file]+set}" ] || continue
            visited[$file]=1
            if [ ! -f "$file" ]; then
              aliased+="$(printf '%q' "$file") is not a file this step can read, so what it sets is unknown."$'\n'
              continue
            fi
            set_keys=$(jq -r 'if type != "object" then error("is not an object") else (.compilerOptions // {}) | if type != "object" then error("compilerOptions is not an object") else [keys[] | select(. == "paths" or . == "baseUrl")] | join(" and ") end end' "$file")
            if [ -n "$set_keys" ]; then
              aliased+="$(printf '%q' "$file") sets $set_keys, which Bun applies to the imports of commitlint's own code."$'\n'
            fi
            targets=$(jq -r '(.extends // empty) | if type == "array" then .[] elif type == "string" then . else error("extends is neither a string nor a list") end' "$file")
            while IFS= read -r target; do
              [ -n "$target" ] || continue
              case "$target" in
                ./* | ../*) ;;
                *)
                  aliased+="$(printf '%q' "$file") extends $(printf '%q' "$target"), a package this step cannot read before the install."$'\n'
                  continue
                  ;;
              esac
              resolved=$(realpath -m -- "$(dirname -- "$file")/$target")
              if [ ! -f "$resolved" ] && [ -f "$resolved.json" ]; then
                resolved=$resolved.json
              fi
              case "$resolved" in
                "$root"/*) queue+=("${resolved#"$root"/}") ;;
                *) aliased+="$(printf '%q' "$file") extends $(printf '%q' "$target"), outside the checkout."$'\n' ;;
              esac
            done <<< "$targets"
          done
          if [ -n "$aliased" ]; then
            while IFS= read -r finding; do
              [ -n "$finding" ] && echo "::error::$finding"
            done <<< "$aliased"
            echo "::error::Remove each paths and baseUrl setting named above. Alias through package.json imports instead."
            exit 1
          fi
      # --ignore-scripts, so no lifecycle script and no prepare script from the caller's tree
      # runs here. commitlint needs none of them.
      - run: bun install --frozen-lockfile --ignore-scripts
      # --from and --to are commitlint's own range: it walks base..head in git. --no-install runs
      # the lockfile's commitlint and refuses to fetch another. --bun runs it under Bun, since
      # bunx otherwise starts a bin whose shebang names node on the runner's node. --config names
      # the caller's one config, so no name commitlint searches before it can stand in for it.
      - name: Pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx --bun --no-install commitlint --config commitlint.config.js --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # GitHub's default squash message lands a one-commit pull request under that commit's subject
      # and a longer one under the title, each with the pull request number appended. That string
      # reaches the default branch, so it is the one the header length rule reads. Every value
      # arrives through the environment and reaches commitlint on stdin, so none is ever a shell
      # word. The caller's rules apply with every ignore off: its config's own ignores and
      # commitlint's defaults (merge, revert, fixup and version subjects) each match text a
      # contributor can type into a title or subject. The config that turns them off is written
      # fresh at the root, over anything tracked there, since commitlint resolves a config's
      # extends from the config's own directory.
      - name: Squash subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$COMMITS" = "1" ]; then
            subject=$(git log -1 --format=%s "$HEAD_SHA")
          else
            subject=$TITLE
          fi
          config=.commitlint-landing.mjs
          rm -f -- "$config"
          printf '%s\n' "import config from './commitlint.config.js';" \
            'export default { ...config, ignores: [], defaultIgnores: false };' > "$config"
          printf '%s (#%s)\n' "$subject" "$NUMBER" | bunx --bun --no-install commitlint --config "$config" --verbose
