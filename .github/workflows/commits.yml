name: commits

# Commit messages on a pull request, linted by the commitlint the caller pins. The caller's
# package.json and bun.lock carry commitlint, and its commitlint.config.js carries the rules and
# reads .github/commit-scopes.json. The job therefore lints what the caller's commit-msg hook
# lints, from the same lockfile. The range is the pull request's base..head, and commitlint reads
# it from git. The subject a squash writes is linted too: the only commit's subject for a
# one-commit pull request, the title otherwise, with the pull request number appended.
#
# A caller's uses: job grants permissions: contents: read. A called job can only lower what its
# caller passes, and a caller passing none is refused before any step runs.
on:
  workflow_call:

permissions: {}

jobs:
  commits:
    # A push carries no pull request range or title, so the job runs on a pull request alone.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so base..head is present. A shallow clone leaves commitlint nothing to
      # read. The job pushes nothing, so the token does not stay in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # packageManager in the caller's package.json is the one Bun pin. The action verifies no
      # download, so that pin plus the cooldown is the control.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # This job runs beside the caller's gate, whatever its stack, so before the install it refuses
      # what would hand commitlint a copy the lockfile does not name. bun install keeps a tracked
      # package directory at the locked version in place of the one it would fetch, and bunx then
      # runs that copy. A tracked .npmrc, at any depth, redirects the install's registry. A
      # package.json patchedDependencies entry is applied even by a frozen install without scripts,
      # so one naming an @commitlint package or a package commitlint.config.js imports is refused.
      # Paths match without regard to case, as Windows and macOS open them. A failed git or jq call,
      # a malformed package.json among them, stops the step.
      - name: Refused paths
        run: |
          tracked=$(git ls-files)
          found=$(printf '%s\n' "$tracked" | grep -iE '(^"?|/)node_modules/|(^"?|/)\.npmrc"?$' || true)
          patched=$(jq -r '(.patchedDependencies // {}) | if type == "object" then keys[] else error("patchedDependencies is not an object") end' package.json)
          imported=""
          if [ -f commitlint.config.js ]; then
            imported=$(grep -oE "(from|import\(|require\()[[:space:]]*['\"][^'\"]+['\"]" commitlint.config.js | sed -E "s/^[^'\"]*['\"]//; s/['\"]$//" || true)
          fi
          refused=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            name=$(printf '%s' "$entry" | sed -E 's/^(@?[^@]+)@.*$/\1/')
            case "$name" in
              @commitlint/*) refused+="$entry"$'\n' ;;
              *)
                while IFS= read -r specifier; do
                  case "$specifier" in
                    "$name" | "$name"/*) refused+="$entry"$'\n' ;;
                  esac
                done <<< "$imported"
                ;;
            esac
          done <<< "$patched"
          if [ -n "$found" ] || [ -n "$refused" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] && echo "::error::$(printf '%q' "$path") is tracked, and bun install would read it in place of what bun.lock names."
            done <<< "$found"
            while IFS= read -r entry; do
              [ -n "$entry" ] && echo "::error::package.json patches $(printf '%q' "$entry"), a package commitlint loads."
            done <<< "$refused"
            echo "::error::Remove each path from the index and each patch named above."
            exit 1
          fi
      # --ignore-scripts, so no lifecycle script and no prepare script from the caller's tree
      # runs here. commitlint needs none of them.
      - run: bun install --frozen-lockfile --ignore-scripts
      # --from and --to are commitlint's own range: it walks base..head in git. --no-install runs
      # the lockfile's commitlint and refuses to fetch another. --bun runs it under Bun, since
      # bunx otherwise starts a bin whose shebang names node on the runner's node.
      - name: Pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx --bun --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # GitHub's default squash message lands a one-commit pull request under that commit's subject
      # and a longer one under the title, each with the pull request number appended. That string
      # reaches the default branch, so it is the one the header length rule reads. Every value
      # arrives through the environment and reaches commitlint on stdin, so none is ever a shell
      # word.
      - name: Squash subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$COMMITS" = "1" ]; then
            subject=$(git log -1 --format=%s "$HEAD_SHA")
          else
            subject=$TITLE
          fi
          printf '%s (#%s)\n' "$subject" "$NUMBER" | bunx --bun --no-install commitlint --verbose
