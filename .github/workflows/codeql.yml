name: codeql

# Code scanning from a committed workflow, one analysis per language the caller names, each on
# the runner and in the build mode the caller gives it. The caller lists the shipped language
# plus actions itself, and nothing is added here, so the list in the caller's codeql.yml is the
# whole list. The job name carries the language, so the check run is named Analyze (<language>)
# and a branch ruleset can require it by that name. In a caller the check run is named
# <caller job> / Analyze (<language>).
#
# Build mode none wherever the extractor supports it. Go has no build mode none, so a Go caller
# passes build-mode autobuild for its go entry. An extractor that needs a runtime gets it from
# the official setup action, so a caller never adds steps of its own. The JavaScript and
# TypeScript extractor runs under the Node.js pinned below. The C# extractor under build-mode
# none restores through the .NET SDK global.json names, installed behind an input, since the
# runner image may not hold it. A caller whose code sits in a submodule passes
# submodules, which the checkout reads.
#
# Every analysis runs the security-extended suite on the CodeQL bundle the action commit ships,
# so the CLI version moves with the action pin and under its cooldown.
#
# This repository is its own caller. A workflow cannot call itself, because a loop in the
# workflow tree is refused, so the push, pull request and schedule triggers below run the job
# directly here, over javascript-typescript and actions: the TypeScript gate under scripts/ is the
# one every Bun repository copies. Every other repository carries the caller in the kickstart.
#
# codeql-action falls back from build-mode none to autobuild for C# and Java on a server-side
# flag, and logs it. The init step below turns the C# flag off. No caller analyzes Java.
#
# A caller's uses: job grants permissions: security-events: write, contents: read, actions: read.
# A called job can only lower what its caller passes, and a caller passing less is refused before
# any step runs.
on:
  workflow_call:
    inputs:
      languages:
        # Each object names a language and can name its runs-on and build-mode. The defaults
        # are ubuntu-latest and none. For example:
        # [{"language": "go", "build-mode": "autobuild"}, {"language": "actions"}]
        description: A JSON array with one object per CodeQL language. Each names language, runs-on and build-mode.
        type: string
        required: true
      global-json-file:
        description: A global.json path. When set, the .NET SDK it names is installed ahead of every analysis.
        type: string
        default: ''
      submodules:
        description: The checkout's submodules value, false, true or recursive.
        type: string
        default: 'false'
  push:
    branches: [main]
  pull_request:
  # At least once a week, so a query published after the last change to this repository still
  # reports against this tree. Thursday, clear of deps.yml's daily cron and audit.yml's.
  schedule:
    - cron: '37 9 * * 4'

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 30
    # Job level, so it holds when the job is called. A caller's workflow-level group is its
    # own, and a shared group with cancel-in-progress would cancel the caller. A pull request's
    # group is its ref, so a new push cancels the run it replaces. A push groups by commit:
    # GitHub keeps one pending run per group and cancels the older pending one, so a ref group
    # would leave the middle push of a burst with no analysis.
    concurrency:
      group: codeql-${{ matrix.language }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The Go extractor skips _test.go files unless this is true, so a Go caller's tests would go
    # unanalyzed where every other language's are read. No other extractor reads it.
    env:
      CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: 'true'
    permissions:
      # Uploading the results to code scanning.
      security-events: write
      # Reading the checkout and the run's metadata. GitHub names both reads for a private
      # repository, and granting them here keeps visibility from deciding what the job does.
      contents: read
      actions: read
    strategy:
      # One language failing still reports the others.
      fail-fast: false
      matrix:
        # A caller must pass languages. The fallback is reachable from this repository's own
        # triggers alone, where the inputs context is empty.
        include: ${{ fromJSON(inputs.languages || '[{"language":"javascript-typescript"},{"language":"actions"}]') }}
    steps:
      # The JavaScript and TypeScript extractor in the bundle this action commit links starts
      # node from PATH, in a job that holds security-events: write, and the runner image's own
      # node moves with the image. So a JavaScript or TypeScript analysis installs the version
      # below ahead of it, as every job that runs a tool under Node.js does. The job runs in the
      # caller's checkout, which holds no file of this repository, so the version lives here
      # rather than in a .node-version, and Renovate bumps this node-version input under the
      # cooldown. Before the checkout, so no repository file exists while the action runs. No
      # cache is restored: cache stays unset, and package-manager-cache is off, since the action
      # restores npm's cache on its own when a package.json names npm. The action verifies no
      # download, so the pin plus the cooldown is the control.
      - if: contains(fromJSON('["javascript-typescript", "javascript", "typescript"]'), matrix.language)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # This repository's own triggers carry no inputs, so submodules falls back to false there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules || 'false' }}
      # The SDK global.json names, for an extractor that restores. The action verifies no
      # download, so that pin plus the cooldown is the control.
      - if: inputs.global-json-file != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.global-json-file }}
      # While GitHub's disable_csharp_buildless flag is on, codeql-action turns a C# build-mode
      # none into autobuild and logs "Scanning C# code without a build is temporarily unavailable.
      # Falling back to 'autobuild' build mode." The caller chose none and this job runs no build,
      # so the variable set to false turns the flag off, which codeql-action reads before it asks
      # GitHub. To take the fallback again, delete the variable.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          CODEQL_ACTION_DISABLE_CSHARP_BUILDLESS: 'false'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode || 'none' }}
          # The bundle this action commit ships. Unset, a server-side flag picks the CLI at run
          # time, which the action pin and its cooldown never see.
          tools: linked
          queries: security-extended
          # The job holds security-events: write, and its results decide the code-scanning check,
          # so it restores no TRAP or dependency cache. Unset, TRAP caching is on for every hosted
          # runner, and a server-side flag turns it off only while overlay analysis runs. Any job
          # on the default branch can write a TRAP cache's key first. Dependency caching is off
          # when unset in a workflow like this one, and is named off so a later action commit
          # that turns it on by default changes nothing here. Whether a pull request restores an
          # overlay database stays with GitHub's overlay flags. Planting one takes code already
          # running on the default branch, landing between that branch's own scans.
          trap-caching: false
          dependency-caching: false
      # The category keeps one language's results from replacing another's.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
