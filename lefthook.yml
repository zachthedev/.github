# Git hooks, installed by `lefthook install`, which the package.json prepare
# script runs on every `bun install`.
#
# Every job starts its tool by its path under node_modules, so the version that
# runs is the one bun.lock pins, nothing is fetched at commit time, and a
# missing package fails the job. bunx --no-install would fall back to PATH, a
# parent node_modules/.bin or its cache. Bun runs the file itself, so no
# shebang picks a node, and --no-env-file keeps it from loading a .env into the
# tool's environment. Bun reads BUN_OPTIONS in any case as arguments ahead of
# its own, and an empty assignment in front of the command clears every
# spelling, where env -u leaves the lower-case ones. When node_modules is gone,
# lefthook itself is missing: the installed hook script exits 0 and the commit
# or push goes through. CI's commits job and gate are the control for that case.

commit-msg:
  jobs:
    # {1} is the message file git hands the hook. The type list comes from the
    # Conventional Commits specification and the scopes from
    # .github/commit-scopes.json, both by way of commitlint.config.js.
    # --config names that one config, so no name commitlint searches before it
    # can stand in for it.
    - name: commitlint
      run: BUN_OPTIONS= bun --no-env-file ./node_modules/@commitlint/cli/cli.js --config commitlint.config.js --edit {1}

pre-push:
  jobs:
    # The gate, the same script the ci workflow's gate job runs. It runs over
    # the working tree, so uncommitted edits count toward the result. Bun runs
    # the file directly rather than through the package script, whose runner
    # puts node_modules/.bin first on PATH.
    - name: check
      run: BUN_OPTIONS= bun --no-env-file scripts/check.ts
