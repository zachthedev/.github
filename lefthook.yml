# Git hooks, installed by `lefthook install`, which the package.json prepare
# script runs on every `bun install`.
#
# Every job resolves its tool with `bunx --no-install`, so the version that
# runs is the one bun.lock pins and nothing is fetched at commit time. When
# lefthook runs and a job's package is missing, the job exits 1, a refusal.
# When node_modules is gone, lefthook itself is missing: the installed hook
# script exits 0 and the commit or push goes through. CI's commits job and
# gate are the control for that case.

commit-msg:
  jobs:
    # {1} is the message file git hands the hook. The type list comes from the
    # Conventional Commits specification and the scopes from
    # .github/commit-scopes.json, both by way of commitlint.config.js.
    - name: commitlint
      run: bunx --no-install commitlint --edit {1}

pre-push:
  jobs:
    # The gate, the same script the ci workflow's gate job runs. It runs over
    # the working tree, so uncommitted edits count toward the result. Bun runs
    # the file directly rather than through the package script, whose runner
    # puts node_modules/.bin first on PATH.
    - name: check
      run: bun scripts/check.ts
