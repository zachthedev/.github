# Git hooks, installed by `lefthook install`, which the package.json prepare
# script runs on every `bun install`.
#
# Every JavaScript tool starts as `bun x --bun --no-install`, the one spelling
# the set uses in hooks, package.json scripts and gate rows. It runs the copy
# node_modules/.bin holds, under Bun rather than a `node` on PATH, and fetches
# nothing. With no copy there, it runs one from a parent directory, PATH or
# Bun's own cache, so the install runs after every pull, every branch switch
# and in every worktree (CONTRIBUTING.md#setup). `bun x` ignores
# --no-env-file, so a personal env file reaches the tool. A hook runs in your
# own environment and clears nothing from it: hooks are not a control, and
# CI's gate and commits job decide the merge (CONTRIBUTING.md#safety). When
# node_modules is gone, lefthook itself is missing and the commit goes
# through.

commit-msg:
  jobs:
    # {1} is the message file git hands the hook. The type list comes from the
    # Conventional Commits specification and the scopes from
    # .github/commit-scopes.json, both by way of commitlint.config.js, which
    # --config names, so commitlint searches for no other config.
    - name: commitlint
      run: bun x --bun --no-install commitlint --config commitlint.config.js --edit {1}

pre-push:
  jobs:
    # The whole gate, the same script the ci workflow's gate job runs. It runs
    # over the working tree, so uncommitted edits count toward the result. It
    # runs by its file, not through bun run, so no node_modules/.bin sits ahead
    # of PATH, and --no-env-file keeps an env file out of the gate.
    - name: check
      run: bun --no-env-file scripts/check.ts
